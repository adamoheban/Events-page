<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LA and OC This Week</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#14181f; --muted:#5a6472; --line:#dfe3e9;
  --accent:#0b5cad; --accent-soft:#e4eefa;
  --c-baseball:#0b5cad; --c-sports:#b4540a; --c-music:#8a2b86; --c-film:#a3283d; --c-food:#1a7a4c; --c-markets:#7a6a12; --c-holiday:#2d7f94;
  --ok:#1a7a4c; --warn:#a36200; --low:#8a93a0;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171c24; --fg:#e8ebf0; --muted:#9aa4b2; --line:#2a313c;
  --accent:#6aa9ee; --accent-soft:#1b2a3d;
  --c-baseball:#6aa9ee; --c-sports:#f0a05e; --c-music:#d98ad4; --c-film:#f08a9b; --c-food:#5fd09a; --c-markets:#d8c55e; --c-holiday:#6fc7dc;
  --ok:#5fd09a; --warn:#e5b04d; --low:#7f8896; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171c24; --fg:#e8ebf0; --muted:#9aa4b2; --line:#2a313c;
  --accent:#6aa9ee; --accent-soft:#1b2a3d;
  --c-baseball:#6aa9ee; --c-sports:#f0a05e; --c-music:#d98ad4; --c-film:#f08a9b; --c-food:#5fd09a; --c-markets:#d8c55e; --c-holiday:#6fc7dc;
  --ok:#5fd09a; --warn:#e5b04d; --low:#7f8896; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);margin:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1{font:700 clamp(24px,5vw,34px)/1.1 var(--font-display);margin:6px 0 6px;text-wrap:balance}
a.back{color:var(--accent);font-weight:600;text-decoration:none;font-size:14px}
p.meta{margin:0;color:var(--muted);max-width:68ch}
.week{margin:18px 0 6px}
.week h2{font:700 20px var(--font-display);margin:0 0 4px}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.wk .day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.wk .day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wk .day h3{font:600 13px var(--font-body);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wk .ev{font-size:13px;line-height:1.35;margin:0 0 7px;padding-left:8px;border-left:3px solid var(--cc,var(--accent));overflow-wrap:anywhere}
.wk .ev a{color:var(--fg);text-decoration:none;font-weight:500}
.wk .ev a:hover{text-decoration:underline}
.wk .ev small{display:block;color:var(--muted)}
.wk .none{color:var(--muted);font-size:13px;margin:0}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">All events, filters and search</a>
<h1>This week</h1>
<p class="meta">Events starting from today through Saturday. Multi-day events appear on their first day.</p>
<div class="wk" id="wk"></div>
</div>
<script src="data.js?v=466"></script>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function weekView(){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate(),dow=now.getDay(),h="";
  var names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for(var i=0;i<=6-dow;i++){
    var dt=new Date(y,m,d+i),iso=dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2);
    var evs=E.filter(function(e){return e[0]===iso}).sort(function(a,b){return a[1]<b[1]?-1:1});
    h+='<div class="day'+(i===0?' today':'')+'"><h3>'+names[dt.getDay()]+' '+mon[dt.getMonth()]+' '+dt.getDate()+(i===0?' (today)':'')+'</h3>';
    if(!evs.length)h+='<p class="none">Nothing listed.</p>';
    evs.forEach(function(e){h+='<p class="ev" style="--cc:var(--c-'+e[5]+')"><a href="'+esc(e[8])+'" target="_blank" rel="noopener">'+esc(e[2])+'</a><small>'+esc(e[1])+' · '+esc(e[3])+'</small></p>'});
    h+='</div>';
  }
  document.getElementById("wk").innerHTML=h;
}
weekView();
</script>
</body>
</html>
